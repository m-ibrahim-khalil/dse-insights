name: capture day end

# The exchange serves a rolling two-year window, so an uncaptured trading day is
# eventually unrecoverable. This runs before anything else in the platform exists.
#
# Deliberately NOT triggered by pull_request. This repository is public, and a
# fork's PR must never get near a key with write access to the landing store.
on:
  schedule:
    # 13:00 UTC = 19:00 Dhaka, several hours after the 14:30 close.
    - cron: "0 13 * * *"
  workflow_dispatch:

# A slow run must never overlap the next schedule and double-write a day.
concurrency:
  group: capture-day-end
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail here, with a readable message, rather than three steps later with a
      # confusing checkout error.
      - name: Check the landing store is configured
        env:
          LANDING_REPO: ${{ vars.LANDING_REPO }}
          LANDING_DEPLOY_KEY: ${{ secrets.LANDING_DEPLOY_KEY }}
        run: |
          test -n "$LANDING_REPO" || { echo "::error::vars.LANDING_REPO is not set"; exit 1; }
          test -n "$LANDING_DEPLOY_KEY" || { echo "::error::secrets.LANDING_DEPLOY_KEY is not set"; exit 1; }

      # Landing is exchange-derived data, which ADR 0001 keeps out of this public
      # repository. It lives in a separate private repo, reached with a deploy key
      # scoped to that repo alone rather than an account-wide token.
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LANDING_REPO }}
          ssh-key: ${{ secrets.LANDING_DEPLOY_KEY }}
          path: landing-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r ingestion/requirements.txt

      # Deliberately re-fetches a week each run. A missed or late run then heals
      # itself on the next one, which is why the schedule slipping does not matter.
      - run: python ingestion/capture_day_end.py --days 7 --landing landing-repo/dse/day_end

      - name: Commit whatever is new
        working-directory: landing-repo
        run: |
          git config user.name "dse-capture"
          git config user.email "noreply@github.com"
          git add -A
          git diff --staged --quiet && echo "nothing new to land" && exit 0
          git commit -m "capture: $(date -u +%F)"
          git push
