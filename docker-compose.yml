# The local platform. One command brings up everything.
#
# LocalExecutor, not Celery: this runs on one machine, so a broker, a worker
# pool and a monitoring UI for the worker pool would be three services carrying
# no weight. The official Airflow compose file uses Celery; this is that file
# reduced to what this project actually needs.
#
# Airflow's metadata lives in its own database, separate from the warehouse.
# Sharing one would put scheduler churn in the same instance as analytical
# queries, and would make "drop the warehouse and reload" destroy the
# orchestrator's entire run history.

name: dse

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: dse/airflow:3.3.1
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    # Nobody needs the tutorial DAGs cluttering a project's own graph.
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # The warehouse, as reached from inside the compose network -- not the
    # localhost port the host's tests and README use.
    DSE_PG_HOST: warehouse
    DSE_PG_PORT: 5432
    DSE_PG_DATABASE: ${DSE_PG_DATABASE:-dse}
    DSE_PG_USER: ${DSE_PG_USER:-dse}
    DSE_PG_PASSWORD: ${DSE_PG_PASSWORD:-dse_local_dev}
    DBT_PROFILES_DIR: /opt/project/dbt
    DSE_ALERT_WEBHOOK: ${DSE_ALERT_WEBHOOK:-}
    DSE_ALERT_QUIET_HOURS: ${DSE_ALERT_QUIET_HOURS:-6}
    DSE_FRESHNESS_MAX_AGE_DAYS: ${DSE_FRESHNESS_MAX_AGE_DAYS:-4}
    AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
    # Airflow is installed into the airflow user's site directory, which Python
    # locates from HOME. Any service overriding the image's entrypoint must set
    # this, or `airflow` resolves to a script that cannot import its own package.
    HOME: /home/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./ingestion:/opt/project/ingestion
    - ./dbt:/opt/project/dbt
    - ./landing:/opt/project/landing
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:

  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DSE_PG_DATABASE:-dse}
      POSTGRES_USER: ${DSE_PG_USER:-dse}
      POSTGRES_PASSWORD: ${DSE_PG_PASSWORD:-dse_local_dev}
    ports:
      # The host port the test suite and README use. Unchanged deliberately.
      - "${DSE_PG_PORT:-55432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/warehouse-schemas.sql:/docker-entrypoint-initdb.d/10-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSE_PG_USER:-dse} -d ${DSE_PG_DATABASE:-dse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Runs once, then exits. Everything else waits for it to succeed.
  #
  # Two container details this needs, both consequences of overriding the image's
  # entrypoint, which normally handles them: HOME must point at the airflow user's
  # home or Python cannot find the airflow package, and the container must run as
  # a uid that exists in /etc/passwd, because Airflow calls getuser() on startup.
  # Root satisfies the second; the long-running services keep the image entrypoint
  # and so run unprivileged.
  #
  # It must also fail loudly. An init that reports success while doing nothing is
  # the exact failure this project exists to catch -- and an earlier version of
  # this file did precisely that.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        if airflow users list 2>/dev/null | grep -q " $${AIRFLOW_ADMIN_USER} "; then
          echo "admin user already exists"
        else
          airflow users create \
            --username "$${AIRFLOW_ADMIN_USER}" \
            --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname DSE --lastname Operator --role Admin \
            --email operator@localhost
        fi
        echo "airflow initialised"
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"
    depends_on: *airflow-common-depends-on

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  warehouse-data:
  airflow-db-data:
